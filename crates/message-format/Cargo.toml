[package]
name = "message-format"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Compile and format message-format catalogs."

[features]
default = ["std"]
std = []
compile = [
    "dep:hashbrown",
    "dep:icu_normalizer",
    "dep:serde",
    "dep:toml",
]
profiling = ["dep:profiling"]

[dependencies]
# always-on (runtime)
bitvec = { default-features = false, features = ["alloc"], version = "1.0.1" }
icu_locale_core = { default-features = false, version = "2.3.0" }
profiling = { optional = true, workspace = true }

# ICU4X runtime
fixed_decimal = { default-features = false, version = "0.7.2" }
icu_calendar = { default-features = false, features = [
    "compiled_data",
], version = "2.3.0" }
icu_datetime = { default-features = false, features = [
    "compiled_data",
], version = "2.3.0" }
icu_decimal = { default-features = false, features = [
    "compiled_data",
], version = "2.3.0" }
icu_experimental = { default-features = false, features = [
    "compiled_data",
], version = "0.6.0" }
icu_locale = { default-features = false, features = [
    "compiled_data",
], version = "2.3.1" }
icu_plurals = { default-features = false, features = [
    "compiled_data",
], version = "2.3.0" }
writeable = { default-features = false, version = "0.6.4" }

# compile (optional)
hashbrown = { default-features = false, features = [
    "default-hasher",
    "raw-entry",
], optional = true, version = "0.17.0" }
icu_normalizer = { default-features = false, features = [
    "compiled_data",
], optional = true, version = "2.3.0" }
serde = { default-features = false, features = [
    "alloc",
    "derive",
], optional = true, version = "1.0" }
toml = { default-features = false, features = [
    "parse",
    "serde",
], optional = true, version = "0.9" }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
