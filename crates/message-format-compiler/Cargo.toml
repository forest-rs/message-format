[package]
name = "message-format-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Compiler from MF2 text to message-format catalog bytecode."

[dependencies]
hashbrown = { default-features = false, features = [
    "default-hasher",
    "raw-entry",
], version = "0.17.0" }
icu_normalizer = { default-features = false, features = ["compiled_data"], version = "2.1.1" }
libm = "0.2"
message-format-runtime = { workspace = true }
profiling = { optional = true, workspace = true }
serde = { default-features = false, features = ["alloc", "derive"], version = "1.0" }
toml = { default-features = false, features = ["parse", "serde"], version = "0.9" }

[features]
default = ["std"]
std = []
profiling = ["dep:profiling", "message-format-runtime/profiling"]

[lints]
workspace = true
